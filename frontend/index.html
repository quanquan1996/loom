<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit: draw under the notch and home indicator; the CSS pads
         with env(safe-area-inset-*). interactive-widget: shrink the layout
         when the keyboard opens (Chrome), so the composer stays above it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- A phone is ChatGPT's app, black; a desktop its web page. See theme.css. -->
    <meta name="theme-color" media="(max-width: 640px)" content="#000000" />
    <meta name="theme-color" content="#212121" />
    <meta name="apple-mobile-web-app-title" content="loom" />
    <!-- Opened from the home screen: an opaque status bar, the page below it.
         Not black-translucent, under which iOS 27 lays a blur over the top of
         the app that nothing on the page can turn off — our header with it.
         iOS reads this when the app is added to the home screen. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>loom</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
